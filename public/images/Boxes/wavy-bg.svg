<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="none">
  <defs>
    <pattern id="waves" x="0" y="0" width="200" height="100" patternUnits="userSpaceOnUse">
      <path d="M0 50 Q25 20 50 50 T100 50 T150 50 T200 50" fill="none" stroke="#000" stroke-width="1.5" opacity="0.3"/>
      <path d="M0 70 Q25 40 50 70 T100 70 T150 70 T200 70" fill="none" stroke="#000" stroke-width="1.5" opacity="0.2"/>
      <path d="M0 30 Q25 0 50 30 T100 30 T150 30 T200 30" fill="none" stroke="#000" stroke-width="1.5" opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- White background -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Wavy pattern overlay -->
  <rect width="100%" height="100%" fill="url(#waves)"/>
  
  <!-- Additional wavy lines for depth -->
  <g opacity="0.15">
    <path d="M-100 200 Q200 100 400 200 T800 200 T1200 200 T1600 200" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M-100 350 Q200 250 400 350 T800 350 T1200 350 T1600 350" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M-100 500 Q200 400 400 500 T800 500 T1200 500 T1600 500" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M-100 650 Q200 550 400 650 T800 650 T1200 650 T1600 650" fill="none" stroke="#000" stroke-width="2"/>
    <path d="M-100 800 Q200 700 400 800 T800 800 T1200 800 T1600 800" fill="none" stroke="#000" stroke-width="2"/>
  </g>
  
  <!-- Subtle wave fills -->
  <g opacity="0.05">
    <path d="M0 0 Q360 80 720 0 T1440 0 L1440 150 Q1080 100 720 150 T0 150 Z" fill="#000"/>
    <path d="M0 750 Q360 820 720 750 T1440 750 L1440 900 L0 900 Z" fill="#000"/>
  </g>
</svg>
